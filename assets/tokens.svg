<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img">
<style>
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace} .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}

.bar{transform-box:fill-box;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes grow{from{transform:scaleY(0)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
</defs>
<rect width="1280" height="470" rx="22" fill="#0a0c10"/><rect width="1280" height="470" rx="22" fill="url(#grid)"/><radialGradient id="glow" cx="100%" cy="0%" r="80%"><stop offset="0" stop-color="#7ee787" stop-opacity=".28"/><stop offset="1" stop-color="#7ee787" stop-opacity="0"/></radialGradient><rect width="1280" height="470" rx="22" fill="url(#glow)"/><rect x=".5" y=".5" width="1279" height="469" rx="22" fill="none" stroke="#1f2430"/>
<text x="64" y="70" class="mono" font-size="14" fill="#8b93a1" letter-spacing="2">TOKENS BURNED · LAST 12 MONTHS</text>
<text x="60" y="170" class="sans" font-size="104" font-weight="800" fill="#eef1f5" letter-spacing="-4">21.9B</text>
<text x="64" y="214" class="sans" font-size="21" fill="#8b93a1">across Codex, Claude and OpenCode, incl. 1B+ on MiniMax</text>
<g class="mono" font-size="15">
  <text x="64" y="262" fill="#eef1f5">~1.8B <tspan fill="#8b93a1">/ month avg</tspan>   5.3B <tspan fill="#8b93a1">last month</tspan>   3,900+ <tspan fill="#8b93a1">contributions this year</tspan></text>
</g>
<rect x="64.0" y="300" width="416.4" height="14" rx="4" fill="#7ee787"/><rect x="483.4" y="300" width="83.9" height="14" rx="4" fill="#ffa657"/><rect x="570.3" y="300" width="50.7" height="14" rx="4" fill="#d2a8ff"/>
<circle cx="70" cy="350" r="6" fill="#7ee787"/><text x="84" y="355" class="mono" font-size="15" fill="#eef1f5">Codex</text><text x="84" y="378" class="mono" font-size="15" fill="#8b93a1">16.4B</text><circle cx="260" cy="350" r="6" fill="#ffa657"/><text x="274" y="355" class="mono" font-size="15" fill="#eef1f5">Claude</text><text x="274" y="378" class="mono" font-size="15" fill="#8b93a1">3.4B+</text><circle cx="450" cy="350" r="6" fill="#d2a8ff"/><text x="464" y="355" class="mono" font-size="15" fill="#eef1f5">OpenCode</text><text x="464" y="378" class="mono" font-size="15" fill="#8b93a1">2.1B</text>
<text x="64" y="430" class="mono" font-size="12" fill="#4b5363">counted from local session logs · input + output + cache · Claude logs only reach back a few months</text>
<text x="690" y="70" class="mono" font-size="14" fill="#8b93a1" letter-spacing="2">PER MONTH</text>
<line x1="690" y1="360" x2="1248" y2="360" stroke="#1f2430"/>
<rect class="bar" style="animation-delay:0.20s" x="690" y="357.0" width="30" height="3.0" rx="5" fill="#3b82f6"/><text x="705.0" y="384" text-anchor="middle" class="mono" font-size="12" fill="#8b93a1">Nov</text><rect class="bar" style="animation-delay:0.26s" x="734" y="357.0" width="30" height="3.0" rx="5" fill="#3b82f6"/><text x="749.0" y="384" text-anchor="middle" class="mono" font-size="12" fill="#8b93a1">Dec</text><rect class="bar" style="animation-delay:0.32s" x="778" y="354.2" width="30" height="5.8" rx="5" fill="#3b82f6"/><text x="793.0" y="384" text-anchor="middle" class="mono" font-size="12" fill="#8b93a1">Jan</text><rect class="bar" style="animation-delay:0.38s" x="822" y="357.0" width="30" height="3.0" rx="5" fill="#3b82f6"/><text x="837.0" y="384" text-anchor="middle" class="mono" font-size="12" fill="#8b93a1">Feb</text><rect class="bar" style="animation-delay:0.44s" x="866" y="357.0" width="30" height="3.0" rx="5" fill="#3b82f6"/><text x="881.0" y="384" text-anchor="middle" class="mono" font-size="12" fill="#8b93a1">Mar</text><rect class="bar" style="animation-delay:0.50s" x="910" y="341.3" width="30" height="18.7" rx="5" fill="#3b82f6"/><text x="925.0" y="384" text-anchor="middle" class="mono" font-size="12" fill="#8b93a1">Apr</text><rect class="bar" style="animation-delay:0.56s" x="954" y="244.6" width="30" height="115.4" rx="5" fill="#3b82f6"/><text x="969.0" y="384" text-anchor="middle" class="mono" font-size="12" fill="#8b93a1">May</text><rect class="bar" style="animation-delay:0.62s" x="998" y="335.6" width="30" height="24.4" rx="5" fill="#3b82f6"/><text x="1013.0" y="384" text-anchor="middle" class="mono" font-size="12" fill="#8b93a1">Jun</text><rect class="bar" style="animation-delay:0.68s" x="1042" y="150.0" width="30" height="210.0" rx="5" fill="#3b82f6"/><text x="1057.0" y="384" text-anchor="middle" class="mono" font-size="12" fill="#8b93a1">Jul</text><rect class="bar" style="animation-delay:0.74s" x="1086" y="201.8" width="30" height="158.2" rx="5" fill="#3b82f6"/><text x="1101.0" y="384" text-anchor="middle" class="mono" font-size="12" fill="#8b93a1">Aug</text><rect class="bar" style="animation-delay:0.80s" x="1130" y="348.4" width="30" height="11.6" rx="5" fill="#3b82f6"/><text x="1145.0" y="384" text-anchor="middle" class="mono" font-size="12" fill="#8b93a1">Sep</text><rect class="bar" style="animation-delay:0.86s" x="1174" y="155.4" width="30" height="204.6" rx="5" fill="#3b82f6"/><text x="1189.0" y="384" text-anchor="middle" class="mono" font-size="12" fill="#8b93a1">Oct</text><rect class="bar" style="animation-delay:0.92s" x="1218" y="268.4" width="30" height="91.6" rx="5" fill="#7ee787"/><text x="1233.0" y="384" text-anchor="middle" class="mono" font-size="12" fill="#8b93a1">Nov</text>
