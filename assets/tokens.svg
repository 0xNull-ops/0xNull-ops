<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img">
<style>
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace} .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}

.bar{transform-box:fill-box;transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes grow{from{transform:scaleX(0)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
</defs>
<rect width="1280" height="470" rx="22" fill="#0a0c10"/><rect width="1280" height="470" rx="22" fill="url(#grid)"/><radialGradient id="glow" cx="100%" cy="0%" r="80%"><stop offset="0" stop-color="#ff8a5c" stop-opacity=".28"/><stop offset="1" stop-color="#ff8a5c" stop-opacity="0"/></radialGradient><rect width="1280" height="470" rx="22" fill="url(#glow)"/><rect x=".5" y=".5" width="1279" height="469" rx="22" fill="none" stroke="#1f2430"/>
<text x="64" y="70" class="mono" font-size="14" fill="#8b93a1" letter-spacing="2">TOKENS PROCESSED · 9 MONTHS</text>
<text x="60" y="170" class="sans" font-size="104" font-weight="800" fill="#eef1f5" letter-spacing="-4">~51B</text>
<text x="64" y="214" class="sans" font-size="21" fill="#8b93a1">across 6 agent harnesses, plus 1B+ on MiniMax</text>
<g class="mono" font-size="15">
  <text x="64" y="270" fill="#eef1f5">5.7B <tspan fill="#8b93a1">/ month</tspan></text>
  <text x="64" y="300" fill="#eef1f5">~4,500 <tspan fill="#8b93a1">agent sessions</tspan></text>
  <text x="64" y="330" fill="#eef1f5">~$9.6k <tspan fill="#8b93a1">at API prices</tspan></text>
  <text x="64" y="360" fill="#eef1f5">3,900+ <tspan fill="#8b93a1">contributions this year</tspan></text>
</g>
<text x="64" y="430" class="mono" font-size="12" fill="#4b5363">90 days measured in Tiller's usage view (17.1B), projected to nine months · input + output + cache</text>
<text x="660" y="70" class="mono" font-size="14" fill="#8b93a1" letter-spacing="2">BY HARNESS</text><text x="660" y="120" class="mono" font-size="15" fill="#eef1f5">Claude Code</text><text x="1216" y="120" text-anchor="end" class="mono" font-size="15" fill="#8b93a1">20.7B</text><rect x="660" y="132" width="556" height="12" rx="6" fill="#ffffff" fill-opacity=".05"/><rect class="bar" style="animation-delay:0.2s" x="660" y="132" width="556" height="12" rx="6" fill="#ff8a5c"/><text x="660" y="178" class="mono" font-size="15" fill="#eef1f5">Codex</text><text x="1216" y="178" text-anchor="end" class="mono" font-size="15" fill="#8b93a1">15.5B</text><rect x="660" y="190" width="556" height="12" rx="6" fill="#ffffff" fill-opacity=".05"/><rect class="bar" style="animation-delay:0.3s" x="660" y="190" width="418" height="12" rx="6" fill="#eef1f5"/><text x="660" y="236" class="mono" font-size="15" fill="#eef1f5">OpenCode</text><text x="1216" y="236" text-anchor="end" class="mono" font-size="15" fill="#8b93a1">9.5B</text><rect x="660" y="248" width="556" height="12" rx="6" fill="#ffffff" fill-opacity=".05"/><rect class="bar" style="animation-delay:0.4s" x="660" y="248" width="255" height="12" rx="6" fill="#58a6ff"/><text x="660" y="294" class="mono" font-size="15" fill="#eef1f5">Antigravity</text><text x="1216" y="294" text-anchor="end" class="mono" font-size="15" fill="#8b93a1">5.4B</text><rect x="660" y="306" width="556" height="12" rx="6" fill="#ffffff" fill-opacity=".05"/><rect class="bar" style="animation-delay:0.5s" x="660" y="306" width="145" height="12" rx="6" fill="#a78bfa"/><text x="660" y="352" class="mono" font-size="15" fill="#eef1f5">Grok + Cursor</text><text x="1216" y="352" text-anchor="end" class="mono" font-size="15" fill="#8b93a1">135M</text><rect x="660" y="364" width="556" height="12" rx="6" fill="#ffffff" fill-opacity=".05"/><rect class="bar" style="animation-delay:0.6s" x="660" y="364" width="6" height="12" rx="6" fill="#8b93a1"/>
</svg>