<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" role="img">
<style>
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace} .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.pulse{animation:p 1.6s ease-in-out infinite}@keyframes p{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
</defs>
<rect width="1280" height="280" rx="18" fill="#0a0c10"/><rect width="1280" height="280" rx="18" fill="url(#grid)"/><radialGradient id="glow" cx="100%" cy="0%" r="80%"><stop offset="0" stop-color="#14b8a6" stop-opacity=".28"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient><rect width="1280" height="280" rx="18" fill="url(#glow)"/><rect x=".5" y=".5" width="1279" height="279" rx="18" fill="none" stroke="#1f2430"/><text x="40" y="64" class="mono" font-size="13" fill="#14b8a6" letter-spacing="2">MY STACK</text><text x="38" y="122" class="sans" font-size="50" font-weight="800" fill="#eef1f5" letter-spacing="-1.5">Hstack</text><text x="40" y="164" class="sans" font-size="19" fill="#8b93a1">My personal coding stack, built on poteto, gstack, tstack and Tiller.</text><rect x="40" y="208" width="68" height="30" rx="15" fill="#ffffff" fill-opacity=".05" stroke="#1f2430"/><text x="74" y="228" text-anchor="middle" class="mono" font-size="13" fill="#eef1f5">poteto</text><rect x="115.6" y="208" width="68" height="30" rx="15" fill="#ffffff" fill-opacity=".05" stroke="#1f2430"/><text x="149" y="228" text-anchor="middle" class="mono" font-size="13" fill="#eef1f5">gstack</text><rect x="191.2" y="208" width="68" height="30" rx="15" fill="#ffffff" fill-opacity=".05" stroke="#1f2430"/><text x="225" y="228" text-anchor="middle" class="mono" font-size="13" fill="#eef1f5">tstack</text><rect x="266.79999999999995" y="208" width="68" height="30" rx="15" fill="#ffffff" fill-opacity=".05" stroke="#1f2430"/><text x="301" y="228" text-anchor="middle" class="mono" font-size="13" fill="#eef1f5">tiller</text><g transform="translate(1240,59)"><circle class="pulse" cx="-130" cy="0" r="5" fill="#14b8a6"/><text x="0" y="5" text-anchor="end" class="mono" font-size="13" fill="#14b8a6" letter-spacing="2">COMING SOON</text></g>
</svg>